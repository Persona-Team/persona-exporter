[package]
name = "persona-exporter"
version = "0.2.0"
edition = "2024"

# Crates for microcontrollers (nostd)
[target.'cfg(target_os = "none")'.dependencies]
postcard = "1.1.3"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-ar"] }
embassy-time = "0.5.1"

embassy-net = { version = "0.9.1", features = ["tcp", "dhcpv4", "medium-ethernet"]}
reqwless = "0.14.0"

# Crates for PC (Linux, Windows, MacOS)
[target.'cfg(not(target_os = "none"))'.dependencies]
#persona-exporter-types = { version = "2.1.1", features = ["full"] }
persona-exporter-types = { version = "2.2.1", features = ["full"]}
influxdb-line-protocol = "2.0.0"
sysinfo = { version = "0.39.3", features = ["system", "disk", "component", "network", "linux-netdevs"], default-features = false }
smol = "2.0.2"
surf = { version = "2.3.2", features = ["h1-client-rustls"], default-features = false}
ureq = { version = "3.4.1", default-features = false, features = ["rustls"] }
#deboa = { version = "0.1.3", default-features = false }
#deboa-smol = { version = "0.1.3", features = ["rust-tls"]}
#deboa-extras = "0.1.0"
#hyper-body-utils = "0.1.16"
form_urlencoded = {  version = "1.2.2", default-features = false }
http = { version = "1.5.0", default-features = false }
url = { version = "2.5.8", default-features = false }

mimalloc = "0.1.52"
smallvec = { version = "1.16.1" }
compact_str = { version = "0.10.0" }

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
argh = { version = "0.1.19", default-features = false, features = ["help"]}

config = { version = "0.15.25", features = ["yaml"], default-features = false}
config-shellexpand = {  version = "0.2.0", default-features = false }
dirs = "6.0.0"

# Common crates (for PC & nostd)
[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
strip = true
panic = "abort"

#[profile.release.yml]`
#opt-level = 3
#debug = true
#codegen-units = 1
#lto = false
#strip = false
#panic = "abort"


[package.metadata.deb]
maintainer = "Lider Nikita <lidernikita661@gmail.com>"
copyright = "2026 Lider Nikita <lidernikita661@gmail.com>"
systemd-units = { enable = true, unit-scripts = "src/configs/", unit-name = "persona-exp", restart-after-upgrade = true }
extended-description = """\
Lightweight system metrics exporter for Prometheus\
A lightweight exporter written in Rust that monitors core system\
metrics such as CPU, RAM, Disk space, and component temperatures.\
Designed with a focus on a "set-and-forget" approach."""
depends = "$auto, systemd"
section = "utility"
priority = "optional"
